<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap');
    </style>
    <title>3J予約システム</title>
</head>
<body>
    <h1>Just Crazy MEDley予約システム</h1>
    <p>ようこそ、Just Crazy MEDley予約システムへ！</p>
    <form action="reserve.html" id="reservation-form">
        <div>
            <label for="date">来場日</label>
            <input type="date" name="date" id="date" min="2026-10-31" max="2026-11-01" required>
        </div>
        <div>
            <label for="time">予約時間:</label>
            <input type="time" name="time" id="time" required>
        </div>
        <div>
            <label for="number-of-times">来場した回数:</label>
            <input type="number" name="number-of-times" id="number-of-times" min="0" required>
        </div>
        <input type="submit" value="予約">
    </form>
    <script src="script.js"></script>
</body>
</html>
