      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap');

    <title>3J予約システム</title>

<body>

        <p class="p1">予約が完了しました</p>
        <p class="p1">予約番号</p>
        <p><span id="reserved-number" class="yoyakubango"></span></p>

            <tr>
                <td>予約時間</td><td><span id="reserved-time"></span></td>

    </div>
    
    <script src="script.js"></script>
